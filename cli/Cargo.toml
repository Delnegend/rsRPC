[package]
name = "rsrpc-cli"
version = "0.28.0"
edition = "2021"
rust-version = "1.85"
authors = ["spikehd"]

[lints]
workspace = true

[dependencies]
rsrpc = { path = "../lib" }
clap = { version = "4.5", features = ["derive", "std", "help", "usage"], default-features = false }
# charset dropped: CLI only reads Discord JSON (UTF-8 fallback is enough).
ureq = { version = "3.3", default-features = false, features = ["rustls"] }
ctrlc = "3.4"
