name: Release / Build Artifacts

# Solo-dev maintenance flow: one run, zero clicks on the happy path.
# Sunday cron (or a manual run) gates on all of CI, then bumps, tags,
# pushes, builds, and ships. No PR, no second run, no PAT.
#
# Branch protection keeps force-push/deletion/linear-history guards but
# requires no status checks, so the bot pushes the bump straight to main.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Empty = ship a new version. SHA = test-build it (no publish). Tag = rebuild it."
        required: false
        type: string
      dry-run:
        description: "Preview only: print each action (gate, bump, tag, build, publish) without doing any of it."
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 0 * * 0' # Weekly: Sunday 00:00 UTC

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Every CI job must pass before anything ships.
  gate:
    name: Gate (all of CI)
    uses: ./.github/workflows/ci.yml

  prepare:
    name: Prepare (bump, tag, push)
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      version: ${{ steps.resolve.outputs.version }}
      publish: ${{ steps.resolve.outputs.publish }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ github.token }}
          persist-credentials: true
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Calculate Next SemVer
        id: semver
        uses: ietf-tools/semver-action@c90370b2958652d71c06a3484129a4d423a6d8a8 # v1
        with:
          token: ${{ github.token }}
          fallbackTag: v0.0.0
          noNewCommitBehavior: silent
          noVersionBumpBehavior: patch

      - name: Bump, tag, and push
        id: resolve
        uses: Delnegend/actions/resolve-release@e5a0d7c3af36381065080b6272d91fde28d17414 # v1
        with:
          ref: ${{ inputs.ref }}
          dry-run: ${{ inputs.dry-run }}
          gate-sha: ${{ github.sha }}
          manifest-path: Cargo.toml
          bump-command: just bump
          semver-bump: ${{ steps.semver.outputs.bump }}
          semver-current: ${{ steps.semver.outputs.current }}
          semver-next: ${{ steps.semver.outputs.next }}
          semver-next-strict: ${{ steps.semver.outputs.nextStrict }}

  build:
    name: Build (${{ matrix.target }})
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
            package: rsrpc-cli
            name: rsrpc
            extra: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
            package: rsrpc-cli
            name: rsrpc
            extra: ""
          # macOS gets a tar.xz rather than a zip, and the formulae name it
          # that way, so the arm64 formula below points at the extension this
          # produces.
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
            package: rsrpc-cli
            name: rsrpc
            extra: ""
          # The Wine/Proton bridge: a 32-bit windows-gnu exe built on Linux,
          # meant to run inside the game's prefix alongside bridge.sh. i686 is
          # required: the bridge reaches the host through the i386 `int 0x80`
          # gate, which Wine does not intercept. bridge.sh resolves the exe
          # from its own directory, so the two ship side by side.
          - os: ubuntu-latest
            target: i686-pc-windows-gnu
            ext: ".exe"
            package: rsrpc-bridge
            name: rsrpc-bridge
            extra: "crates/bridge/scripts/bridge.sh"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.target }}
      # *-windows-gnu links through mingw-w64's i686-w64-mingw32-gcc.
      - name: Install the mingw-w64 linker
        if: matrix.target == 'i686-pc-windows-gnu'
        shell: bash
        run: |
          if ! command -v i686-w64-mingw32-gcc >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq gcc-mingw-w64-i686
          fi
      - name: Build release binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PACKAGE: ${{ matrix.package }}
        run: cargo build -p "$PACKAGE" --release --target "$TARGET"
      # Names the archive `<name>-<version>-<target>.<ext>` and uploads it
      # under that same name, so the run, the release and a formula all agree.
      # Format, effort and layout are the action's decision, not this file's.
      - name: Package artifact
        uses: Delnegend/actions/package-artifact@2edc1c04a7a1205396fc26fc8da87c10695602db # v1
        with:
          name: ${{ matrix.name }}
          version: ${{ needs.prepare.outputs.version }}
          target: ${{ matrix.target }}
          source: target/${{ matrix.target }}/release/${{ matrix.package }}${{ matrix.ext }}
          extra: ${{ matrix.extra }}

  publish:
    name: Publish Consolidated Release
    needs: [prepare, build]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          # Each matrix entry uploads one archive; merge them into a single
          # directory rather than one subdirectory per entry.
          merge-multiple: true
      # No re-zip and no chmod: the build job already produced the release
      # archive, and the executable bit is recorded inside it rather than
      # having been stripped by the download.
      - name: Publish release
        if: needs.prepare.outputs.publish == 'true'
        uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b # v3
        with:
          tag_name: ${{ needs.prepare.outputs.ref }}
          generate_release_notes: true
          files: dist/*
