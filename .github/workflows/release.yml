name: Release / Build Artifacts

# Solo-dev maintenance flow: one run, zero clicks on the happy path.
# Sunday cron (or a manual run) gates on all of CI, then bumps, tags,
# pushes, builds, and ships. No PR, no second run, no PAT.
#
# Branch protection keeps force-push/deletion/linear-history guards but
# requires no status checks, so the bot pushes the bump straight to main.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Empty = ship a new version. SHA = test-build it (no publish). Tag = rebuild it."
        required: false
        type: string
      dry-run:
        description: "Preview only: print each action (gate, bump, tag, build, publish) without doing any of it."
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 0 * * 0' # Weekly: Sunday 00:00 UTC

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Every CI job must pass before anything ships.
  gate:
    name: Gate (all of CI)
    uses: ./.github/workflows/ci.yml

  prepare:
    name: Prepare (bump, tag, push)
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      version: ${{ steps.resolve.outputs.version }}
      publish: ${{ steps.resolve.outputs.publish }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ github.token }}
          persist-credentials: true
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Calculate Next SemVer
        id: semver
        uses: ietf-tools/semver-action@c90370b2958652d71c06a3484129a4d423a6d8a8 # v1
        with:
          token: ${{ github.token }}
          fallbackTag: v0.0.0
          noNewCommitBehavior: silent
          noVersionBumpBehavior: patch

      - name: Bump, tag, and push
        id: resolve
        uses: Delnegend/actions/resolve-release@1299339be1f82a70f2580c26c82f5a6925b99dc4 # v1
        with:
          ref: ${{ inputs.ref }}
          dry-run: ${{ inputs.dry-run }}
          gate-sha: ${{ github.sha }}
          manifest-path: Cargo.toml
          bump-command: just bump
          semver-bump: ${{ steps.semver.outputs.bump }}
          semver-current: ${{ steps.semver.outputs.current }}
          semver-next: ${{ steps.semver.outputs.next }}
          semver-next-strict: ${{ steps.semver.outputs.nextStrict }}

  build:
    name: Build (${{ matrix.target }})
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
            package: rsrpc-cli
            name: rsrpc
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
            package: rsrpc-cli
            name: rsrpc
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
            package: rsrpc-cli
            name: rsrpc
          # The Wine/Proton bridge: a windows-gnu exe built on Linux, meant
          # to run inside the game's prefix alongside bridge.sh.
          - os: ubuntu-latest
            target: x86_64-pc-windows-gnu
            ext: ".exe"
            package: rsrpc-bridge
            name: rsrpc-bridge
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.target }}
      # *-windows-gnu links through mingw-w64's x86_64-w64-mingw32-gcc.
      - name: Install the mingw-w64 linker
        if: matrix.target == 'x86_64-pc-windows-gnu'
        shell: bash
        run: |
          if ! command -v x86_64-w64-mingw32-gcc >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq gcc-mingw-w64-x86-64
          fi
      - name: Build release binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PACKAGE: ${{ matrix.package }}
        run: cargo build -p "$PACKAGE" --release --target "$TARGET"
      - name: Stage artifact
        env:
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
          PACKAGE: ${{ matrix.package }}
          NAME: ${{ matrix.name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "$PACKAGE" = "rsrpc-bridge" ]; then
            # Keep the bare exe name: bridge.sh launches `rsrpc-bridge.exe`
            # from its own directory inside the prefix.
            cp "target/$TARGET/release/$PACKAGE$EXT" dist/rsrpc-bridge.exe
            cp crates/bridge/scripts/bridge.sh dist/
          else
            cp "target/$TARGET/release/$PACKAGE$EXT" "dist/$NAME-$TARGET$EXT"
          fi
      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.name }}-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish Consolidated Release
    needs: [prepare, build]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Zip each artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # actions/download-artifact does not preserve the executable bit,
          # so the zips would ship non-executable binaries and scripts
          # (bridge.sh is a Steam launch option). Restore it before zipping.
          find artifacts -type f -exec chmod +x {} +
          for dir in artifacts/*/; do
            folder="$(basename "$dir")"
            (cd "$dir" && zip -j -r "../../dist/${folder}.zip" .)
          done
      - name: Publish release
        if: needs.prepare.outputs.publish == 'true'
        uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b # v3
        with:
          tag_name: ${{ needs.prepare.outputs.ref }}
          generate_release_notes: true
          files: dist/*
