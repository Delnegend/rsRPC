name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  # The release workflow calls the whole file as its gate: all jobs below
  # must pass before anything ships.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check (just check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
      # Registry/index and target/ persist across runs; the key rolls with
      # the lockfile, so a dependency bump starts a fresh cache.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          # Pinned: audits must run the same binary release every time.
          tool: cargo-audit@0.22.2
      - name: Run verification
        shell: bash
        run: just check

  windows-check:
    name: Windows Target Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # A release might only surface `#[cfg(target_os = "windows")]` compile
      # errors on windows-latest; type-check them on every push instead. The
      # CLI is skipped because its ring build script needs a real MSVC
      # toolchain — the library carries all windows-only code.
      - name: Check the library for the Windows (msvc) target
        shell: bash
        run: cargo check -p rsrpc --lib --target x86_64-pc-windows-msvc
      # Build rather than `cargo check`: the bridge's inline-asm syscall
      # wrappers compile cleanly even against the wrong ABI, so only a full
      # build proves the mingw target and linker are wired up correctly.
      - name: Build the bridge for the Windows (i686 gnu) target
        shell: bash
        run: |
          rustup target add i686-pc-windows-gnu
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-i686
          cargo build -p rsrpc-bridge --target i686-pc-windows-gnu --release

  scan:
    name: Scan
    uses: Delnegend/actions/.github/workflows/scan.yml@6b0ff42cc9e8937cd1b37faebccd093fc6c68a86 # v1
    permissions:
      contents: read
    with:
      scans: gitleaks actionlint semgrep trivy osv
      trivy-scanners: vuln,secret
