name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  # The release workflow calls the whole file as its gate: all jobs below
  # must pass before anything ships.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check (just check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-audit
      - name: Run verification
        shell: bash
        run: just check

  windows-check:
    name: Windows Target Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: x86_64-pc-windows-msvc
      # A release might only surface `#[cfg(target_os = "windows")]` compile
      # errors on windows-latest; type-check them on every push instead. The
      # CLI is skipped because its ring build script needs a real MSVC
      # toolchain — the library carries all windows-only code.
      - name: Check the library for the Windows (msvc) target
        shell: bash
        run: cargo check -p rsrpc --lib --target x86_64-pc-windows-msvc
      # The release ships the bridge as a windows-gnu exe; its windows-only
      # code must compile too. `cargo check` needs the target's std, not the
      # mingw linker.
      - name: Check the bridge for the Windows (gnu) target
        shell: bash
        run: |
          rustup target add x86_64-pc-windows-gnu
          cargo check -p rsrpc-bridge --target x86_64-pc-windows-gnu

  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run Gitleaks
        shell: bash
        run: docker run --rm -v "$GITHUB_WORKSPACE:/path" zricethezav/gitleaks:latest detect --source="/path" --verbose

  sast-scan:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run Semgrep OSS
        shell: bash
        run: docker run --rm -v "$GITHUB_WORKSPACE:/src" returntocorp/semgrep semgrep scan --config=auto --error

  trivy-scan:
    name: Container & Infra (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run Trivy (OS packages & Misconfigurations)
        shell: bash
        run: docker run --rm -v "$GITHUB_WORKSPACE:/src" aquasec/trivy fs /src --severity HIGH,CRITICAL --exit-code 1

  osv-scan:
    name: Dependencies (OSV-Scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run OSV-Scanner
        shell: bash
        run: docker run --rm -v "$GITHUB_WORKSPACE:/src" ghcr.io/google/osv-scanner:latest --recursive /src