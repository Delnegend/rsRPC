name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  # The release workflow calls the whole file as its gate: all jobs below
  # must pass before anything ships.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check (just check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
      - name: Install cargo-audit
        shell: bash
        run: cargo install cargo-audit --locked
      - name: Run verification
        shell: bash
        run: just check

  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run Gitleaks
        shell: bash
        run: docker run --rm -v "$GITHUB_WORKSPACE:/path" zricethezav/gitleaks:latest detect --source="/path" --verbose

  sast-scan:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run Semgrep OSS
        shell: bash
        run: docker run --rm -v "$GITHUB_WORKSPACE:/src" returntocorp/semgrep semgrep scan --config=auto --error

  trivy-scan:
    name: Container & Infra (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run Trivy (OS packages & Misconfigurations)
        shell: bash
        run: docker run --rm -v "$GITHUB_WORKSPACE:/src" aquasec/trivy fs /src --severity HIGH,CRITICAL --exit-code 1

  osv-scan:
    name: Dependencies (OSV-Scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run OSV-Scanner
        shell: bash
        run: docker run --rm -v "$GITHUB_WORKSPACE:/src" ghcr.io/google/osv-scanner:latest --recursive /src