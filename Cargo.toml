[workspace]
members = ["crates/lib", "crates/cli", "crates/bridge"]
default-members = ["crates/lib", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.29.4"
edition = "2024"

[workspace.dependencies]
rsrpc = { path = "crates/lib" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "ansi"] }

[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.lints.clippy]
# Namtao strict lints: stop runtime panics and unexpected crashes
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
panic_in_result_fn = "deny"
unchecked_time_subtraction = "deny"

# Progressive disclosure: allow non-panic style warnings
pedantic = { level = "allow", priority = -1 }
nursery = { level = "allow", priority = -1 }

[profile.release]
opt-level = 3
# Thin LTO for CI speed; full LTO lives in [profile.dist] for releases.
lto = "thin"
codegen-units = 16
# Binaries are shipped stripped; keep symbols in dev/test for backtraces.
strip = true
# Abort on panic: smaller binaries, no unwinding in a single-shot RPC bridge.
panic = "abort"

# Release artifacts only (`cargo build --profile dist`).
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0

[profile.test]
opt-level = 0
