[package]
name = "rsrpc-bridge"
version = "0.28.0"
edition = "2021"
rust-version = "1.85"
authors = ["spikehd", "Delnegend"]
description = "Wine and Proton named pipe bridge for rsRPC"

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52.0", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_System_IO",
] }
